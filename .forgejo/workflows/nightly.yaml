name: Nightly Example Update Check

on:
  schedule:
    - cron: "21 3 * * *"
  workflow_dispatch:

jobs:
  nightly:
    name: nightly
    runs-on: nix
    steps:
      - name: Checkout code
        uses: https://data.forgejo.org/actions/checkout@v4

      - name: Run nightly checks
        id: run-checks
        run: |
          set -uox pipefail

          log_file="$(mktemp)"

          printf 'log_file=%s\n' "$log_file" >>"$FORGEJO_OUTPUT"

          trap 'tail -n 50 "$log_file" 2>/dev/null || true' EXIT

          cilogger --log-file "$log_file" --timeout 60m --timestamps -- \
            sh -c "nix run .#update-examples && nix flake check -L && nix run .#ci"

      - name: Open issue on failure
        if: ${{ failure() }}
        env:
          LOG_FILE: ${{ steps.run-checks.outputs.log_file }}
        run: |
          set -uo pipefail

          tail_log="$(tail -n 300 "$LOG_FILE" 2>/dev/null || printf '(log unavailable: %s)\n' "$LOG_FILE")"
          run_url="${FORGEJO_SERVER_URL}/${FORGEJO_REPOSITORY}/actions/runs/${FORGEJO_RUN_NUMBER}"

          payload="$(jq -n --arg title "nightly check failed ($(date -u +%Y-%m-%d))" \
            --arg run_url "$run_url" \
            --arg log "$tail_log" \
            '{
               title: $title,
               body: ("Nightly check failed.\n\nFull run log: " + $run_url +
                      "\n\n<details><summary>Last 300 lines of the run log</summary>\n\n~~~\n" +
                      $log + "\n~~~\n\n</details>\n")
             }')"

          curl -sSf -X POST \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "${FORGEJO_API_URL}/repos/${FORGEJO_REPOSITORY}/issues"
