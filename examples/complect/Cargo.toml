[workspace]
resolver = "2"
members = ["crates/common", "crates/extra", "crates/agent", "crates/engine"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BlueOak-1.0.0"

[workspace.metadata.crane]
name = "complect"

# Chonkier but more useful for combined profiling/debugging.
[profile.dev]
opt-level = 1
debug = 2
strip = "none"
lto = false
codegen-units = 256
debug-assertions = false

[profile.dev.package."*"]
opt-level = 1

# Slow but fully optimized the "real" release profile, also slower than frozen
# molasses on Pluto to build with lto/1 codegen unit.
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3

[profile.release.package."*"]
codegen-units = 1
opt-level = 3
strip = "debuginfo"

# release without lto/codegen-units=1, for faster iteration on release-build
# testing.
[profile.release-fast]
inherits = "release"
codegen-units = 16
lto = false

[profile.release-fast.package."*"]
codegen-units = 16
opt-level = 3
strip = "debuginfo"

# release optimized for code size over speed.
[profile.release-small]
inherits = "release"
opt-level = "z"

[profile.release-small.package."*"]
codegen-units = 1
opt-level = "z"
strip = "debuginfo"
